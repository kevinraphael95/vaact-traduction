<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAACT Trad Vérif</title>
<link rel="stylesheet" href="style.css">
<script>
  // Application du thème avant le rendu pour éviter le flash clair
  (function() {
    try {
      const saved = localStorage.getItem('vaact-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
</head>
<body>

<!-- ========================================================================
     ÉCRAN DE CHARGEMENT
     ======================================================================== -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Chargement des cartes…</div>
  </div>
</div>

<!-- ========================================================================
     BARRE SUPÉRIEURE
     ======================================================================== -->
<div class="topbar">
  <div class="topbar-inner">

    <!-- Logo : texte visible en desktop, masqué en mobile -->
    <div class="logo">
      <div class="logo-icon">⚔️</div>
      <span class="logo-text">VAACT - Vérificateur de Traduction</span>
    </div>

    <div class="topbar-center">

      <!-- Champ de recherche avec bouton × -->
      <div class="search-wrap">
        <input type="text" class="search-input" id="searchInput" placeholder="Chercher une carte…">
        <button type="button" class="search-clear" id="searchClear" title="Effacer la recherche" aria-label="Effacer">✕</button>
      </div>

      <!-- Filtres : desktop uniquement -->
      <label class="filter-vaact desktop-only" title="Afficher seulement les cartes VAACT (effet modifié)">
        <input type="checkbox" id="vaactFilter">
        <span>VAACT</span>
      </label>

      <label class="filter-vaact desktop-only" title="Afficher seulement les cartes sans correspondance EN/FR">
        <input type="checkbox" id="incompleteFilter">
        <span>⚠️ Incomplètes</span>
      </label>

      <!-- Aléatoire : toujours visible -->
      <button class="btn-random" id="randomBtn" title="Carte aléatoire">
        🎲 <span class="btn-random-label">Aléatoire</span>
      </button>

      <!-- Thème : desktop uniquement -->
      <button class="btn-theme desktop-only" id="themeToggle" title="Changer de thème">🌙</button>

      <!-- Bouton filtres : mobile uniquement -->
      <button class="btn-mobile-filters" id="mobileFiltersBtn" title="Filtres" aria-label="Ouvrir les filtres">☰</button>
    </div>

  </div>
</div>

<!-- ========================================================================
     PANNEAU FILTRES MOBILE
     ======================================================================== -->
<div class="mobile-filters-panel" id="mobileFiltersPanel">

  <label class="filter-vaact" title="Afficher seulement les cartes VAACT">
    <input type="checkbox" id="vaactFilterMobile">
    <span>VAACT</span>
  </label>

  <label class="filter-vaact" title="Afficher seulement les cartes incomplètes">
    <input type="checkbox" id="incompleteFilterMobile">
    <span>⚠️ Incomplètes</span>
  </label>

  <button class="btn-theme-mobile" id="themeToggleMobile">🌙 Thème sombre</button>

</div>

<!-- ========================================================================
     CONTENU PRINCIPAL
     ======================================================================== -->
<div class="container" id="mainContainer" style="display:none;">
  <div class="main-grid">

    <!-- Colonne gauche : visuel + infos -->
    <div class="card-visual">
      <div class="card-image">
        <img id="cardImg" alt="">
      </div>
      <div class="card-info">
        <div class="info-row"><span class="label">ID</span><span class="value" id="infoId">—</span></div>
        <div class="info-row"><span class="label">Type</span><span class="value" id="infoType">—</span></div>
        <div class="info-row"><span class="label">Attribut</span><span class="value" id="infoAttr">—</span></div>
        <div class="info-row"><span class="label">ATK / DEF</span><span class="value" id="infoStats">—</span></div>
        <div class="info-row"><span class="label">Niveau</span><span class="value" id="infoLevel">—</span></div>
      </div>
    </div>

    <!-- Colonne droite : texte original + traduction -->
    <div class="content-col">
      <div class="section">
        <div class="section-title">📖 Texte original (anglais)</div>
        <div class="original-box">
          <div class="original-name" id="origName">—</div>
          <div class="original-desc" id="origDesc">—</div>
        </div>
      </div>

      <div id="translationSection"></div>
    </div>

  </div>
</div>

<!-- ========================================================================
     BARRE DE NAVIGATION
     ======================================================================== -->
<div class="nav-bar" id="navBar" style="display:none;">
  <div class="nav-inner">
    <button class="nav-btn" id="prevBtn">← Précédent</button>
    <span class="nav-center" id="navCenter">1 / 1</span>
    <button class="nav-btn" id="nextBtn">Suivant →</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
