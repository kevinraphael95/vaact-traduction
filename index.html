<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAACT Trad Vérif</title>
<link rel="stylesheet" href="style.css">
<script>
  // Application du thème avant le rendu pour éviter le flash clair
  (function() {
    try {
      const saved = localStorage.getItem('vaact-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
</head>
<body>

<!-- ========================================================================
     ÉCRAN DE CHARGEMENT
     ======================================================================== -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Chargement des cartes…</div>
  </div>
</div>

<!-- ========================================================================
     BARRE SUPÉRIEURE
     ======================================================================== -->
<div class="topbar">
  <div class="topbar-inner">

    <div class="logo">
      <div class="logo-icon">⚔️</div>
      <span class="logo-text">VAACT - Vérificateur de Traduction</span>
    </div>

    <!-- Barre de recherche : toujours visible dans la topbar -->
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="Chercher une carte…">
      <button type="button" class="search-clear" id="searchClear" title="Effacer" aria-label="Effacer">✕</button>
    </div>

    <!-- Bouton Filtres avec badge de compteur -->
    <button class="btn-filters" id="filtersBtn" title="Filtres" aria-label="Filtres">
      <span class="btn-filters-label">≡ Filtres</span>
      <span class="badge-count" style="display:none;">0</span>
    </button>

    <!-- Aléatoire -->
    <button class="btn-random" id="randomBtn" title="Carte aléatoire">
      🎲 <span class="btn-random-label">Aléatoire</span>
    </button>

    <!-- Thème -->
    <button class="btn-theme" id="themeToggle" title="Changer de thème">🌙</button>

  </div>
</div>

<!-- ========================================================================
     PANNEAU FILTRES (VAACT + Incomplètes uniquement)
     ======================================================================== -->
<div class="filters-panel" id="filtersPanel">

  <div class="filters-panel-title">Filtres</div>

  <label class="filter-option">
    <input type="checkbox" id="filterVaact">
    <span class="label-text">VAACT uniquement</span>
  </label>

  <label class="filter-option">
    <input type="checkbox" id="filterIncomplete">
    <span class="label-text">⚠️ Incomplètes uniquement</span>
  </label>

</div>

<!-- ========================================================================
     CONTENU PRINCIPAL
     ======================================================================== -->
<div class="container" id="mainContainer" style="display:none;">
  <div class="main-grid">

    <!-- Colonne gauche : visuel + infos -->
    <div class="card-visual">
      <div class="card-image">
        <img id="cardImg" alt="">
      </div>
      <div class="card-info">
        <div class="info-row"><span class="label">ID</span><span class="value" id="infoId">—</span></div>
        <div class="info-row"><span class="label">Type</span><span class="value" id="infoType">—</span></div>
        <div class="info-row"><span class="label">Attribut</span><span class="value" id="infoAttr">—</span></div>
        <div class="info-row"><span class="label">ATK / DEF</span><span class="value" id="infoStats">—</span></div>
        <div class="info-row"><span class="label">Niveau</span><span class="value" id="infoLevel">—</span></div>
      </div>
    </div>

    <!-- Colonne droite : texte original + traduction -->
    <div class="content-col">
      <div class="section">
        <div class="section-title">📖 Texte original (anglais)</div>
        <div class="original-box">
          <div class="original-name" id="origName">—</div>
          <div class="original-desc" id="origDesc">—</div>
        </div>
      </div>

      <div id="translationSection"></div>
    </div>

  </div>
</div>

<!-- ========================================================================
     BARRE DE NAVIGATION
     ======================================================================== -->
<div class="nav-bar" id="navBar" style="display:none;">
  <div class="nav-inner">
    <button class="nav-btn" id="prevBtn">← Précédent</button>
    <span class="nav-center" id="navCenter">1 / 1</span>
    <button class="nav-btn" id="nextBtn">Suivant →</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
