<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAACT Trad Vérif</title>
<meta name="description" content="Vérificateur de traduction pour les fichiers .cdb Yu-Gi-Oh! — compare le fichier original anglais et la traduction française, carte par carte.">
<link rel="stylesheet" href="style.css">
<script>
  // Application du thème avant le rendu pour éviter le flash clair.
  // Ce script doit rester inline et sans defer : il doit s'exécuter avant
  // le premier paint, sinon l'utilisateur voit un flash clair→sombre.
  (function () {
    var theme = "light";
    try {
      var stored = localStorage.getItem('vaact-theme');
      if (stored) theme = stored;
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
    } catch (e) {
      try {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
      } catch (e2) {}
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<!-- defer : le HTML s'affiche d'abord, sql.js se charge en parallèle.
     Sans defer, un CDN lent bloque le premier paint. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js" defer></script>
</head>
<body>

<!-- ========================================================================
     ÉCRAN DE CHARGEMENT
     ======================================================================== -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-box">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loading-text" id="loadingText" role="status" aria-live="polite">Chargement des cartes…</div>
  </div>
</div>

<!-- Toast (recherche sans résultat, etc.) -->
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<!-- ========================================================================
     BARRE SUPÉRIEURE
     ======================================================================== -->
<header class="topbar">
  <div class="topbar-inner">

    <div class="logo">
      <div class="logo-icon" aria-hidden="true">⚔️</div>
      <span class="logo-text">VAACT - Vérificateur de Traduction</span>
    </div>

    <!-- Groupe de contrôles, collé à droite -->
    <div class="topbar-center">

      <div class="search-wrap" role="search">
        <input
          type="search"
          class="search-input"
          id="searchInput"
          placeholder="Chercher une carte…"
          aria-label="Rechercher une carte"
          autocomplete="off"
        >
        <button type="button" class="search-clear" id="searchClear" title="Effacer" aria-label="Effacer la recherche">✕</button>
      </div>

      <div class="filters-anchor">
        <button class="btn-filters" id="filtersBtn" type="button" title="Filtres" aria-label="Filtres" aria-expanded="false" aria-controls="filtersPanel">
          <span class="btn-filters-label">≡ Filtres</span>
          <span class="badge-count" style="display:none;">0</span>
        </button>

        <div class="filters-panel" id="filtersPanel" role="dialog" aria-label="Filtres">
          <div class="filters-panel-title">Filtres</div>

          <label class="filter-option">
            <input type="checkbox" id="filterVaact">
            <span class="label-text">VAACT uniquement</span>
          </label>

          <label class="filter-option">
            <input type="checkbox" id="filterIncomplete">
            <span class="label-text">⚠️ Incomplètes uniquement</span>
          </label>

          <div class="filters-sep"></div>

          <div class="filters-panel-title">Filtres personnalisés</div>

          <div class="custom-chips" id="customChips"></div>

          <div class="custom-add-row">
            <input type="text" id="customKeywordInput" placeholder="Ajouter un mot-clé…" aria-label="Ajouter un mot-clé" autocomplete="off">
            <button type="button" class="btn-add" id="customAddBtn" title="Ajouter" aria-label="Ajouter">＋</button>
          </div>

          <div class="custom-hint">La carte doit contenir <strong>tous</strong> les mots-clés.</div>

          <button type="button" class="btn-reset" id="filterResetBtn">Tout effacer</button>
        </div>
      </div>

      <button class="btn-random" id="randomBtn" type="button" title="Carte aléatoire" aria-label="Carte aléatoire">
        <span aria-hidden="true">🎲</span> <span class="btn-random-label">Aléatoire</span>
      </button>

      <button class="btn-theme" id="themeToggle" type="button" title="Changer de thème" aria-label="Basculer le thème clair / sombre">🌙</button>

    </div>
  </div>
</header>

<!-- ========================================================================
     CONTENU PRINCIPAL
     ======================================================================== -->
<main class="container" id="mainContainer" hidden>
  <div class="main-grid">

    <div class="card-visual">
      <div class="card-image">
        <img id="cardImg" alt="">
      </div>
      <div class="card-info">
        <div class="info-row"><span class="label">ID</span><span class="value" id="infoId">—</span></div>
        <div class="info-row"><span class="label">Type</span><span class="value" id="infoType">—</span></div>
        <div class="info-row"><span class="label">Attribut</span><span class="value" id="infoAttr">—</span></div>
        <div class="info-row"><span class="label">ATK / DEF</span><span class="value" id="infoStats">—</span></div>
        <div class="info-row"><span class="label">Niveau</span><span class="value" id="infoLevel">—</span></div>
      </div>
    </div>

    <div class="content-col">
      <div class="section">
        <div class="section-title">📖 Texte original (anglais)</div>
        <div class="original-box">
          <div class="original-name" id="origName" aria-live="polite">—</div>
          <div class="original-desc" id="origDesc">—</div>
        </div>
      </div>

      <div id="translationSection" aria-live="polite"></div>
    </div>

  </div>
</main>

<!-- ========================================================================
     BARRE DE NAVIGATION
     ======================================================================== -->
<nav class="nav-bar" id="navBar" hidden aria-label="Navigation entre les cartes">
  <div class="nav-inner">
    <button class="nav-btn" id="prevBtn" type="button">← Précédent</button>
    <span class="nav-center" id="navCenter" aria-live="polite">1 / 1</span>
    <button class="nav-btn" id="nextBtn" type="button">Suivant →</button>
  </div>
</nav>

<script src="app.js"></script>
</body>
</html>
