<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAACT Trad Vérif</title>
<link rel="stylesheet" href="style.css">
<script>
  // Application du thème avant le rendu pour éviter le flash clair
  (function() {
    try {
      const saved = localStorage.getItem('vaact-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<!--
  === VERSION DE SECOURS (non active) ===
  Le script ci-dessus abandonne tout si localStorage jette (Safari privé
  strict, cookies bloqués, etc.), y compris la détection de la préférence
  système. Cette version isole le try/catch : si localStorage échoue, on
  essaie quand même matchMedia pour respecter la préférence système.

  Pour activer : remplacer le <script> ci-dessus par ce bloc.

  <script>
    (function () {
      var theme = "light";
      try {
        var stored = localStorage.getItem('vaact-theme');
        if (stored) theme = stored;
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
      } catch (e) {
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e2) {}
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
